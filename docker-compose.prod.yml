version: '3.8'

services:
  app:
    build:
      context: .
      target: production
    container_name: sh_store_app
    restart: always
    env_file: .env.production
    volumes:
      - storage_data:/var/www/html/storage/app
      - logs_data:/var/www/html/storage/logs
    networks:
      - sh_store_network
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:1.25-alpine
    container_name: sh_store_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - sh_store_network
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: sh_store_postgres
    restart: always
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sh_store_network

  redis:
    image: redis:7-alpine
    container_name: sh_store_redis
    restart: always
    command: sh -c 'redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes'
    env_file: .env.production
    volumes:
      - redis_data:/data
    networks:
      - sh_store_network

  certbot:
    image: certbot/certbot:latest
    container_name: sh_store_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  storage_data:
  logs_data:
  certbot_www:
  certbot_conf:

networks:
  sh_store_network:
    driver: bridge

